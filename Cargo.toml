[package]
name = "yt-dev-mcp"
version = "0.1.0"
edition = "2021"
description = "Personal code-workflow MCP server (plans, codex workers, review/gate, release scans)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
